function formacion(x0, x1, y, prof, out, nivel, dif) {
  if (prof === 0 || x1 - x0 < 50) {
    const hp = Math.max(1, Math.ceil((1 + Math.floor(nivel / 3)) * dif.enemy_hp));
    out.push({ x: (x0 + x1) / 2, y, hp, max: hp, r: 15, t: Math.random() * 6, kind: prof, boss: false }); return;
  }
  const mid = (x0 + x1) / 2;
  formacion(x0, mid, y + 38, prof - 1, out, nivel, dif);
  formacion(mid, x1, y + 38, prof - 1, out, nivel, dif);
  if (prof % 2 === 0) {
    const hp = Math.max(1, Math.ceil((2 + nivel) * dif.enemy_hp));
    out.push({ x: mid, y, hp, max: hp, r: 17, t: 0, kind: 9, boss: false });
  }
}

function peligro(x, paso) {

function buscarRuta(x, paso, prof, limite) {

    if (k === 'KeyF') verPerf = !verPerf;
    if (estado === 'play' && (k === 'Escape' || k === 'KeyP')) { pausa = !pausa; sel = 0; Audio_.play('select'); keys.add(k); return; }
    if (estado === 'play' && !pausa && k === 'KeyT') { g.auto = !g.auto; g.route = []; }
  }
  keys.add(k);
  if (enMenu()) {
    const n = opciones().length;
    if (k === 'ArrowUp' || k === 'KeyW') { sel = (sel - 1 + n) % n; Audio_.play('select'); }
    if (k === 'ArrowDown' || k === 'KeyS') { sel = (sel + 1) % n; Audio_.play('select'); }
    if (k === 'ArrowLeft' || k === 'KeyA') accion(sel, -1);
    if (k === 'ArrowRight' || k === 'KeyD') accion(sel, 1);
    if (k === 'Enter' || k === 'NumpadEnter' || k === 'Space') accion(sel);
  }
});
addEventListener('keyup', ev => keys.delete(ev.code));
addEventListener('blur', () => { keys.clear(); mouse.down = false; if (estado === 'play' && !pausa) { pausa = true; sel = 0; } });
const pos = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height]; };
cv.addEventListener('pointermove', ev => {
  const p = pos(ev); mouse.x = p[0]; mouse.y = p[1];
  if (enMenu()) rectsOpciones(y0Menu).forEach((r, i) => { if (dentro(r, p)) sel = i; });
  else mouse.activo = true;
});
cv.addEventListener('pointerdown', ev => {
  Audio_.init(); ev.preventDefault();
  if (estado === 'salir') { location.reload(); return; }
  const p = pos(ev); mouse.x = p[0]; mouse.y = p[1];
  if (enMenu()) {
    const rs = rectsOpciones(y0Menu);
    for (let i = 0; i < rs.length; i++) if (dentro(rs[i], p)) { sel = i; accion(i); break; }
  } else if (dentro({ x: W - 44, y: 44, w: 30, h: 30 }, p)) { pausa = true; sel = 0; }
  else { mouse.activo = true; mouse.down = true; }
});
addEventListener('pointerup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- bucle ----------
let last = 0, acc = 0, frames = 0, fpsT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  let dt = ts - last; last = ts; if (dt > 100) dt = 100;
  acc += dt; fpsT += dt; frames++;
  if (fpsT >= 500) { fps = frames * 1000 / fpsT; frames = 0; fpsT = 0; }
  const STEP = 1000 / 60; let n = 0;
  while (acc >= STEP) {
    acc -= STEP; fCount++;
    { const p = estado === 'play' && pausa; // detener/reanudar música al pausar
      if (Audio_.musicGain && p !== window._musPausa) { window._musPausa = p; const t = Audio_.ctx.currentTime;
        Audio_.musicGain.gain.cancelScheduledValues(t); Audio_.musicGain.gain.setTargetAtTime(p ? 0 : .6, t, .05); } }
    if (estado === 'play' && !pausa) actualizar();
    if (++n > 3) { acc = 0; break; }
  }
  if (estado === 'salir') {
    ctx.fillStyle = 'rgb(2,3,12)'; ctx.fillRect(0, 0, W, H);
    texto('GRACIAS POR JUGAR', F_MID, C.ship, W / 2, H / 2 - 20, true, C.ship);
    texto('Toca o presiona una tecla para volver', F_S, [150, 170, 190], W / 2, H / 2 + 24);
    return;
  }
  fondoEspacial();
  if (estado === 'play') dibujarJuego();
  if (enMenu()) dibujarMenu();
}
Audio_.tema('menu');
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('bold 20px Orbitron');
})();
</script>
